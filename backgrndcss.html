<!DOCTYPE html>
<html>
    <head>
        <style>
            img{
                width: 100px;
                height: 200px;
            }
            highlight.border{
                border:5px solid rgb(252, 0, 34);
                border-radius: 8px; 
            }
        </style>        
    </head>
    <body>
        <img id="myimage" src="images.jpg"alt="sample image">
        <br>
        <button id="addBorderBtn">Toggle Border</button>
        <script>
            const btn=document.getElementById("borderBtn");
            const img=document.getElementById("myimage");
            btn.addEventListener("click",function(){
                img.classlist.toggle("higlight-border");
            });
        </script>
    </body>
</html>
